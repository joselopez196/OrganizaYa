/* ===== ORGANIZAYA · GUÍA PROFESIONAL Y MULTIPANTALLA ===== */
:root{
  --brand:#8b5cf6;
  --brand2:#6366f1;
  --preview-bg:#0b1024;
  --preview-panel:#121a38;
}
#md{
  background:rgba(3,7,18,.78);

  width:min(100%,980px);

}

<script>/* js/model/storage.js */
/* ===== MODELO · js/model/storage.js =====
   PATRÓN REPOSITORIO: lectura y escritura en localStorage e IndexedDB (estado y archivos). */
const openStateDB=()=>new Promise(r=>{try{const q=indexedDB.open('mi-sistema-state',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('state'))q.result.createObjectStore('state')};q.onsuccess=()=>{mobileStateDB=q.result;r(q.result)};q.onerror=()=>r(null)}catch(e){r(null)}});
const stateGet=()=>new Promise(r=>{if(!mobileStateDB)return r(null);try{const q=mobileStateDB.transaction('state','readonly').objectStore('state').get('data');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const statePut=v=>{try{if(!mobileStateDB)return;const q=mobileStateDB.transaction('state','readwrite').objectStore('state').put(v,'data');q.onerror=()=>{}}catch(e){}};
const loadMobileState=async()=>{const v=await stateGet();if(v&&v.json){try{const r=JSON.parse(v.json);if(r&&typeof r==='object'){const oldAt=S.at||0,newAt=r.at||0;if(!oldAt||newAt>=oldAt)S=Object.assign({tasks:[],projects:[],files:[],links:DL},r);seedH()}}catch(e){}}stateReady=true;Bus.emit('render')};
const saveLocal=()=>{const j=JSON.stringify(S);try{localStorage.setItem('mi-sistema',j)}catch(e){}statePut({json:j,at:S.at||Date.now()});};
const openDB=()=>new Promise(r=>{try{const q=indexedDB.open('mi-sistema-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=(m,fn)=>new Promise(r=>{if(!db)return r(null);try{const q=fn(db.transaction('f',m).objectStore('f'));q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function blobUrl(id){if(urls[id])return urls[id];const b=await idb('readonly',s=>s.get(id));if(b)return urls[id]=URL.createObjectURL(b);const f=S.files.find(x=>x.id===id);return f&&f.aid?'/_blob/'+f.aid:null}

</script>
<script>/* js/model/links.js */
/* ===== MODELO · js/model/links.js =====
   Reglas de los accesos: identificar el sitio y migrar versiones antiguas de datos. */
const hostOf=u=>{const pk=/^intent:.*package=([\w.]+)/i.exec(u);if(pk)return 'pkg:'+pk[1];const q=/^https:\/\/play\.google\.com\/store\/search.*[?&]q=([^&]*)/.exec(u);if(q)return 'play:'+q[1];if(/^whatsapp:/i.test(u))return 'whatsapp.app';try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
function migL(){let ch=false;if((S.lv||0)<2){const have=new Map(S.links.map(l=>[hostOf(l.url),l])),top=DL.slice(0,10).map(d=>have.get(hostOf(d.url))||d),th=new Set(top.map(l=>hostOf(l.url)));S.links=top.concat(S.links.filter(l=>!th.has(hostOf(l.url))));ch=true}
if((S.lv||0)<3){const old='code.visualstudio.com',has=S.links.some(l=>hostOf(l.url)==='visualstudio.microsoft.com');S.links=has?S.links.filter(l=>hostOf(l.url)!==old):S.links.map(l=>hostOf(l.url)===old?Object.assign(l,{name:DL[9].name,url:DL[9].url,color:DL[9].color}):l);ch=true}
if((S.lv||0)<4){let at=S.links.findIndex(l=>hostOf(l.url)==='visualstudio.microsoft.com')+1||S.links.length;DL.slice(10,13).forEach(d=>{const k=S.links.findIndex(l=>hostOf(l.url)===hostOf(d.url));if(k<0){S.links.splice(at,0,d);at++}else at=k+1});ch=true}
if((S.lv||0)<5){DL.slice(16).forEach(d=>{if(!S.links.some(l=>hostOf(l.url)===hostOf(d.url)))S.links.push(d)});ch=true}
if((S.lv||0)<6){DL.filter(d=>['Google','Maps','Fotos'].includes(d.name)).forEach(d=>{if(!S.links.some(l=>hostOf(l.url)===hostOf(d.url)))S.links.push(d)});ch=true}
if((S.lv||0)<7){S.links.forEach(l=>{if(/whatsapp/i.test(hostOf(l.url)))l.url='whatsapp://send'});ch=true}
if((S.lv||0)<8){const nm=x=>x.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,''),have=new Set(S.links.flatMap(l=>[nm(l.name),hostOf(l.url)]));NEW.forEach(a=>{const u=mkU(a[1]);if(!have.has(nm(a[0]))&&!have.has(hostOf(u)))S.links.push({id:uid(),name:a[0],url:u,color:a[2]})});ch=true}
if((S.lv||0)<9){S.links.forEach(l=>{if(hostOf(l.url)==='pkg:com.facebook.lite')l.name='Facebook Lite'});ch=true}
S.lv=9;return ch}
if(migL())saveLocal();

</script>
<script>/* js/model/changes.js */
/* ===== MODELO · js/model/changes.js =====
   Seguimiento de cambios por elemento y guardado (save). */
let lastH={};
const hItem=x=>JSON.stringify(Object.assign({},x,{u:0}));
const seedH=()=>{lastH={};[...S.tasks,...S.projects].forEach(x=>{lastH[x.id]=hItem(x)})};
const stamp=()=>{const n=Date.now();[...S.tasks,...S.projects].forEach(x=>{const h=hItem(x);if(lastH[x.id]!==h){x.u=n;lastH[x.id]=h}})};
seedH();
const save=()=>{stamp();S.at=Date.now();saveLocal();push()};

</script>
<script>/* js/model/sync.js */
/* ===== MODELO · js/model/sync.js =====
   Sincronización genérica: instantánea, subida diferida y fusión de datos remotos. */
let cloud=null,pushT=null;
const snap=()=>JSON.stringify({tasks:S.tasks,projects:S.projects,links:S.links,files:S.files,lastBackup:S.lastBackup,at:S.at,lv:S.lv,adv:S.adv,del:S.del});
const push=()=>{if(!cloud)return;clearTimeout(pushT);pushT=setTimeout(()=>cloud.set({json:snap()}).then(()=>autoBk()).catch(()=>{}),1200)};
let ast=null,bkc=null,bkT=0;
const mergeF=rf=>{if(!rf)return S.files;const ids=new Set(rf.map(f=>f.id));return rf.concat(S.files.filter(f=>!f.aid&&!ids.has(f.id)))};
const UPT=f=>f.size<=20*1048576&&/^(image\/|video\/|text\/)|pdf|json|csv|markdown/.test(f.type||'');
function applyRemote(r,init){
  const rw=(r.at||0)>(S.at||0),del=Object.assign({},r.del,S.del);
  const mg=(a,b)=>{const m=new Map();(a||[]).forEach(x=>{if(x&&x.id&&!del[x.id])m.set(x.id,x)});(b||[]).forEach(x=>{if(!x||!x.id||del[x.id])return;const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0)||((x.u||0)===(o.u||0)&&rw))m.set(x.id,x)});return[...m.values()]};
  const norm=a=>JSON.stringify([...(a||[])].sort((x,y)=>x.id<y.id?-1:1));
  const rt=norm(r.tasks),rp=norm(r.projects);
  S.del=del;S.tasks=mg(S.tasks,r.tasks);S.projects=mg(S.projects,r.projects);
  if(rw){S.links=r.links||S.links;S.lastBackup=r.lastBackup;S.adv=r.adv||S.adv;S.lv=r.lv||0}
  S.files=mergeF(r.files);const mig=migL();
  const push2=(r.at||0)<(S.at||0)||norm(S.tasks)!==rt||norm(S.projects)!==rp||mig;
  S.at=Math.max(r.at||0,S.at||0);seedH();if(push2)save();else saveLocal();
  if(init){Bus.emit('render');Bus.emit('toast','Datos sincronizados')}}

</script>
<script>/* js/model/cloud-claude.js */
/* ===== MODELO · js/model/cloud-claude.js =====
   PATRÓN ESTRATEGIA (1/2): proveedor de nube de claude.ai. */
async function autoBk(force){if(!bkc||(!force&&Date.now()-bkT<6e5))return;bkT=Date.now();try{await bkc.doc(today()).set({json:snap(),at:Date.now()});const q=await bkc.get(),ds=q.docs.map(d=>d.id).filter(i=>/^\d{4}-/.test(i)).sort();for(const i of ds.slice(0,-14))await bkc.doc(i).delete()}catch(e){}}
async function cloudUp(f){if(!ast||f.aid||!UPT(f))return 0;const b=await idb('readonly',s=>s.get(f.id));if(!b)return 0;try{const r=await ast.upload(b);f.aid=r.id;return 1}catch(e){return 0}}
async function cloudInit(){try{if(!window.claude)return;const u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;const id=await u.id();if(!id)return;cloud=d.doc('data/users/'+id+'/state');bkc=d.collection('data/users/'+id+'/backups');try{ast=await claude.use('assets')}catch(e){}
 const sn=await cloud.get(),r=sn.exists?JSON.parse(sn.data().json):null;
 if(r)applyRemote(r,true);else cloud.set({json:snap()}).catch(()=>{});
 cloud.onSnapshot(sn=>{if(!sn.exists)return;try{const q=JSON.parse(sn.data().json);if((q.at||0)>(S.at||0)){applyRemote(q);Bus.emit('render-soft');Bus.emit('toast','Sincronizado con tus otros dispositivos')}}catch(e){}},()=>{});
 autoBk(true);Bus.emit('render-if','hoy')}catch(e){cloud=null}}

</script>
<script>/* js/model/cloud-supabase.js */
/* ===== MODELO · js/model/cloud-supabase.js =====
   PATRÓN ESTRATEGIA (2/2): proveedor de nube Supabase (misma interfaz get/set). */
/* ===== Sincronizacion entre dispositivos con Supabase (cuenta propia, sin servidor mio) ===== */
const SBK='ms-sb',SBSQL=`-- Mi sistema: tabla para sincronizar entre dispositivos.
-- Pégalo en Supabase > SQL Editor > New query > Run. Se puede ejecutar más de una vez sin problema.
create table if not exists public.ms_state (
  user_id uuid primary key references auth.users(id) on delete cascade,
  state text not null,
  updated_at timestamptz not null default now()
);
alter table public.ms_state enable row level security;
drop policy if exists ms_select on public.ms_state;
drop policy if exists ms_insert on public.ms_state;
drop policy if exists ms_update on public.ms_state;
drop policy if exists ms_delete on public.ms_state;
create policy ms_select on public.ms_state for select to authenticated using (auth.uid() = user_id);
create policy ms_insert on public.ms_state for insert to authenticated with check (auth.uid() = user_id);
create policy ms_update on public.ms_state for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy ms_delete on public.ms_state for delete to authenticated using (auth.uid() = user_id);
`;
let sb=null,sbOn=false,sbT=null,sbBusy=false,sbErr='';
const sbLoad=()=>{try{const o=JSON.parse(localStorage.getItem(SBK)||'null');return o&&typeof o.url==='string'&&typeof o.key==='string'?o:null}catch(e){return null}};
const sbStore=()=>{try{if(sb)localStorage.setItem(SBK,JSON.stringify(sb));else localStorage.removeItem(SBK)}catch(e){}};
const sbUrlOk=u=>/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(u);
async function sbRefresh(){try{const r=await fetch(sb.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:sb.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sb.rt})});if(!r.ok){sbErr='Tu sesión venció. Vuelve a entrar.';return false}const j=await r.json();sb.at=j.access_token;sb.rt=j.refresh_token;sbStore();return true}catch(e){return false}}
async function sbReq(path,opt,again){const h=Object.assign({apikey:sb.key,'Content-Type':'application/json',Authorization:'Bearer '+(sb.at||sb.key)},opt&&opt.headers);
  const r=await fetch(sb.url+path,Object.assign({},opt,{headers:h}));
  if(r.status===401&&sb.rt&&again!==false&&await sbRefresh())return sbReq(path,opt,false);return r}
function sbCloud(){return{
  async get(){const r=await sbReq('/rest/v1/ms_state?select=state&user_id=eq.'+encodeURIComponent(sb.uid));
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(/ms_state/.test(t)?'tabla':String(r.status))}
    const a=await r.json();return{exists:a.length>0&&!!a[0].state,data:()=>({json:a[0]&&a[0].state})}},
  async set(o){const j=JSON.parse(o.json);delete j.files;
    try{const r=await sbReq('/rest/v1/ms_state?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:sb.uid,state:JSON.stringify(j),updated_at:new Date().toISOString()})});
      if(!r.ok)throw new Error(r.status);sbErr=''}catch(e){sbErr='No se pudo subir. Se reintentará.';throw e}}}}
async function sbPoll(){if(!sb||!cloud||!sbOn||sbBusy||document.hidden||navigator.onLine===false)return;sbBusy=true;
  try{const sn=await cloud.get();if(!sn.exists){await cloud.set({json:snap()});return}
    const q=JSON.parse(sn.data().json);sbErr='';
    if((q.at||0)>(S.at||0)){applyRemote(q);Bus.emit('render-soft');Bus.emit('toast','Sincronizado con tus otros dispositivos')}
    else if((q.at||0)<(S.at||0))await cloud.set({json:snap()})}
  catch(e){}finally{sbBusy=false}}
async function sbInit(first){sb=sb||sbLoad();if(!sb||!sb.at||cloud)return;
  try{const c=sbCloud(),sn=await c.get();cloud=c;sbOn=true;sbErr='';
    const r=sn.exists?JSON.parse(sn.data().json):null;
    if(r)applyRemote(r,true);else c.set({json:snap()}).catch(()=>{});
    clearInterval(sbT);sbT=setInterval(sbPoll,20000);Bus.emit('render')}
  catch(e){cloud=null;sbOn=false;sbErr=e&&e.message==='tabla'?'Falta crear la tabla en Supabase (toca Copiar SQL y pégalo en el editor SQL).':navigator.onLine===false?'Sin conexión. Se sincronizará al volver internet.':'No se pudo conectar. Revisa la URL y la clave.';if(first)Bus.emit('toast',sbErr)}}

</script>
<script>/* js/model/validation.js */
/* ===== MODELO · js/model/validation.js =====

/* Validacion de datos importados */
const okId=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(x),okCol=c=>typeof c==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(c),okDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d),okUrl=u=>typeof u==='string'&&u.length<2048&&/^(https?:\/\/|whatsapp:|intent:|tel:|sms:|itms-apps:|googlechromes:|microsoft-edge-https:)/i.test(u);
function cleanS(r){if(!r||typeof r!=='object')return null;
  const A=a=>Array.isArray(a)?a:[],T=(v,n)=>typeof v==='string'?v.slice(0,n||300):'',N=(v,d)=>Number.isFinite(+v)&&v!==null&&v!==''?+v:d,seen=new Set(),fresh=id=>{if(seen.has(id))return false;seen.add(id);return true};
  const o={tasks:[],projects:[],files:[],links:[],del:{}};
  A(r.tasks).forEach(t=>{if(!t||!okId(t.id)||!T(t.title).trim()||!fresh(t.id))return;o.tasks.push({id:t.id,title:T(t.title,300),p:okId(t.p)?t.p:'',due:okDate(t.due)?t.due:'',pri:[0,1,2].includes(+t.pri)?+t.pri:0,note:T(t.note,5000),done:!!t.done,doneAt:okDate(t.doneAt)?t.doneAt:'',time:/^\d{2}:\d{2}$/.test(t.time||'')?t.time:'',rep:['dia','sem','mes'].includes(t.rep)?t.rep:'',nx:t.nx?1:0,subs:A(t.subs).map(x=>({x:T(x&&x.x,300),d:!!(x&&x.d)})).filter(x=>x.x),u:N(t.u,0)})});
  A(r.projects).forEach(q=>{if(!q||!okId(q.id)||!T(q.name).trim()||!fresh(q.id))return;o.projects.push({id:q.id,name:T(q.name,200),color:okCol(q.color)?q.color:COL[0],due:okDate(q.due)?q.due:'',st:['activo','pausado','terminado'].includes(q.st)?q.st:'activo',arch:!!q.arch,u:N(q.u,0)})});
  A(r.links).forEach(l=>{if(!l||!okId(l.id)||!T(l.name).trim()||!okUrl(l.url)||!fresh(l.id))return;o.links.push({id:l.id,name:T(l.name,80),url:l.url,color:okCol(l.color)?l.color:COL[0]})});
  A(r.files).forEach(f=>{if(!f||!okId(f.id)||!fresh(f.id))return;const x={id:f.id,name:T(f.name,255)||'archivo',size:Math.max(0,N(f.size,0)),type:T(f.type,100),k:['img','vid','pres','otro'].includes(f.k)?f.k:'otro',ext:T(f.ext,6),p:okId(f.p)?f.p:'',created:N(f.created,0)};if(okId(f.aid))x.aid=f.aid;o.files.push(x)});
  if(r.del&&typeof r.del==='object')Object.keys(r.del).forEach(k=>{if(okId(k))o.del[k]=1});
  o.adv=N(r.adv,7);if(o.adv<1||o.adv>100)o.adv=7;o.lastBackup=okDate(r.lastBackup)?r.lastBackup:'';o.lv=Math.max(0,N(r.lv,0));return o}
/* marca como borrados los elementos que ya no estan en una copia restaurada, para que otros dispositivos no los devuelvan */
function replaceData(c){S.del=Object.assign({},S.del);const keep=new Set([...c.tasks,...c.projects].map(x=>x.id));[...S.tasks,...S.projects].forEach(x=>{if(!keep.has(x.id))S.del[x.id]=1});keep.forEach(id=>{delete S.del[id]});S.tasks=c.tasks;S.projects=c.projects;if(c.links.length)S.links=c.links;lastH={};}

</script>

<script>/* js/view/spotlight.js */
/* ===== VISTA · js/view/spotlight.js =====
   Buscador Global (Ctrl+K), atajos de teclado y síntesis de audio Web. */
let spotOpen = false, spotIdx = 0, spotResults = [];

const playChime = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.22);
  } catch (e) {}
};

function openSpotlight() {
  const sp = $('#spotlight');
  if (!sp) return;
  spotOpen = true;
  spotIdx = 0;
  sp.innerHTML = `<div class="spot-box" role="dialog" aria-modal="true" aria-label="Búsqueda rápida">
    <div class="spot-head">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="spotInput" placeholder="Buscar tareas, proyectos, archivos o accesos…" autocomplete="off" spellcheck="false" oninput="renderSpotlight(this.value)">
      <button class="x" onclick="closeSpotlight()" aria-label="Cerrar">×</button>
    </div>
    <div class="spot-body" id="spotBody"></div>
    <div class="spot-foot">
      <span>Navegar <span class="kbd">↑</span> <span class="kbd">↓</span> · Abrir <span class="kbd">↵</span></span>
      <span>Cerrar <span class="kbd">Esc</span></span>
    </div>
  </div>`;
  sp.style.display = 'grid';
  renderSpotlight('');
  const inp = $('#spotInput');
  if (inp) inp.focus();
}

function closeSpotlight() {
  const sp = $('#spotlight');
  if (sp) {
    sp.style.display = 'none';
    sp.innerHTML = '';
  }
  spotOpen = false;
}

function renderSpotlight(q) {
  const b = $('#spotBody');
  if (!b) return;
  q = (q || '').trim().toLowerCase();
  spotResults = [];

  if (!q) {
    const acts = [
      { t: 'Nueva tarea rápida', m: 'Crear tarea', icon: '+', fn: () => { closeSpotlight(); tab = 'tareas'; draw(); setTimeout(() => $('#tt') && $('#tt').focus(), 50); } },
      { t: 'Nuevo proyecto', m: 'Crear proyecto', icon: '📁', fn: () => { closeSpotlight(); tab = 'proyectos'; draw(); setTimeout(() => $('#pn') && $('#pn').focus(), 50); } },
      { t: 'Ver Calendario', m: 'Ir a Calendario', icon: '📅', fn: () => { closeSpotlight(); tab = 'calendario'; draw(); } },
      { t: 'Ver Accesos directos', m: 'Ir a Accesos', icon: '🚀', fn: () => { closeSpotlight(); tab = 'accesos'; draw(); } },
      { t: 'Cambiar tema claro/oscuro', m: 'Tema', icon: '🌓', fn: () => { closeSpotlight(); cycleTheme(); } },
      { t: 'Atajos de teclado', m: 'Ver atajos', icon: '⌨', fn: () => { closeSpotlight(); shortcutsModal(); } }
    ];
    let h = '<div class="spot-sec">Acciones rápidas</div>';
    acts.forEach((a, idx) => {
      spotResults.push(a);
      h += `<div class="spot-item ${idx === spotIdx ? 'on' : ''}" onclick="spotExec(${idx})" onmouseenter="spotSetIdx(${idx})"><i>${a.icon}</i><span class="stitle">${esc(a.t)}</span><span class="smeta">${esc(a.m)}</span></div>`;
    });

    const pend = S.tasks.filter(t => !t.done).slice(0, 5);
    if (pend.length) {
      h += '<div class="spot-sec">Tareas próximas</div>';
      pend.forEach(t => {
        const item = { t: t.title, m: fd(t.due), icon: '✓', fn: () => { closeSpotlight(); editT(t.id); } };
        const idx = spotResults.length;
        spotResults.push(item);
        h += `<div class="spot-item ${idx === spotIdx ? 'on' : ''}" onclick="spotExec(${idx})" onmouseenter="spotSetIdx(${idx})"><i>${item.icon}</i><span class="stitle">${esc(item.t)}</span><span class="smeta">${esc(item.m)}</span></div>`;
      });
    }
    b.innerHTML = h;
    return;
  }

  const matchTasks = S.tasks.filter(t => t.title.toLowerCase().includes(q) || (t.note && t.note.toLowerCase().includes(q))).slice(0, 6);
  const matchProjs = S.projects.filter(p => p.name.toLowerCase().includes(q)).slice(0, 4);
  const matchFiles = S.files.filter(f => f.name.toLowerCase().includes(q)).slice(0, 4);
  const matchLinks = S.links.filter(l => l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)).slice(0, 4);

  let h = '';

  if (matchProjs.length) {

      const item = { t: p.name, m: cap(p.st || 'activo'), icon: '📁', fn: () => { closeSpotlight(); openP(p.id); } };

    });
  }

  if (matchFiles.length) {
    h += '<div class="spot-sec">Archivos (' + matchFiles.length + ')</div>';
    matchFiles.forEach(f => {
      const item = { t: f.name, m: size(f.size), icon: '📄', fn: () => { closeSpotlight(); openF(f.id); } };
      const idx = spotResults.length;
      spotResults.push(item);
      h += `<div class="spot-item ${idx === spotIdx ? 'on' : ''}" onclick="spotExec(${idx})" onmouseenter="spotSetIdx(${idx})"><i>${item.icon}</i><span class="stitle">${esc(item.t)}</span><span class="smeta">${esc(item.m)}</span></div>`;
    });
  }

  if (matchLinks.length) {
    h += '<div class="spot-sec">Accesos directos (' + matchLinks.length + ')</div>';
    matchLinks.forEach(l => {
      const item = { t: l.name, m: l.url.replace(/^https?:\/\//, '').split('/')[0], icon: '↗', fn: () => { closeSpotlight(); window.open(safeU(l.url, l), '_blank', 'noopener,noreferrer'); } };
      const idx = spotResults.length;

    });
  }

  if (!spotResults.length) {
    h = '<div class="empty" style="padding:24px 16px;text-align:center">No se encontraron resultados para "' + esc(q) + '"</div>';
  }

  b.innerHTML = h;
}

document.addEventListener('keydown', e => {
  const isInput = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (spotOpen) closeSpotlight(); else openSpotlight();
    return;
  }
  if (spotOpen) {
    if (e.key === 'Escape') { closeSpotlight(); e.preventDefault(); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      spotIdx = (spotIdx + 1) % Math.max(1, spotResults.length);
      spotSetIdx(spotIdx);
      const onEl = document.querySelector('.spot-item.on'); if (onEl) onEl.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      spotIdx = (spotIdx - 1 + spotResults.length) % Math.max(1, spotResults.length);
      spotSetIdx(spotIdx);
      const onEl = document.querySelector('.spot-item.on'); if (onEl) onEl.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      spotExec(spotIdx);
      return;
    }
    return;
  }

  if (!isInput) {
    if (e.key === '?') shortcutsModal();
    else if (e.key === '1' || e.key.toLowerCase() === 'h') { tab = 'hoy'; draw(); }
    else if (e.key === '2' || e.key.toLowerCase() === 't') { tab = 'tareas'; draw(); }
    else if (e.key === '3' || e.key.toLowerCase() === 'c') { tab = 'calendario'; draw(); }
    else if (e.key === '4' || e.key.toLowerCase() === 'p') { tab = 'proyectos'; draw(); }
    else if (e.key === '5' || e.key.toLowerCase() === 'a') { tab = 'archivos'; draw(); }
    else if (e.key === '6' || e.key.toLowerCase() === 'l') { tab = 'accesos'; draw(); }
    else if (e.key.toLowerCase() === 'n') { tab = 'tareas'; draw(); setTimeout(() => $('#tt') && $('#tt').focus(), 40); }
    else if (e.key.toLowerCase() === 'd') cycleTheme();
  }
});

async function checkStorageUsage() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const used = est.usage ? size(est.usage) : '0 KB';
      const quota = est.quota ? (est.quota > 1e9 ? (est.quota / 1e9).toFixed(0) + ' GB' : size(est.quota)) : '';
      const el = $('#storageStatus');
      if (el) el.textContent = `Almacenamiento local: ${used}${quota ? ' de ' + quota : ''}`;
    }
  } catch (e) {}
}

  ask('Esta copia tiene '+c.tasks.length+' tareas, '+c.projects.length+' proyectos y '+c.files.length+' archivos. Reemplaza todo lo que tienes ahora. ¿Continuar?','Reemplazar',()=>importar2(c,j.files))}catch(e){toast('Ese archivo no es una copia válida')}finally{if(inp)inp.value=''}}
async function importar2(c,bl){try{
  const ids=new Set(c.files.map(f=>f.id)),blobs=[];
  for(const b of Array.isArray(bl)?bl:[]){if(b&&okId(b.id)&&ids.has(b.id)&&typeof b.data==='string'&&b.data.startsWith('data:'))blobs.push([b.id,d2b(b.data)])}
  const have=new Set(blobs.map(x=>x[0]));
  for(const f of S.files)await idb('readwrite',s=>s.delete(f.id));
  Object.keys(urls).forEach(k=>{try{URL.revokeObjectURL(urls[k])}catch(e){}delete urls[k]});
  replaceData(c);S.files=c.files.filter(f=>have.has(f.id)||f.aid);S.adv=c.adv;S.lastBackup=c.lastBackup;S.lv=c.lv;
  for(const x of blobs)await idb('readwrite',s=>s.put(x[1],x[0]));
  migL();save();draw();toast('Copia restaurada')}catch(e){toast('No se pudo restaurar la copia')}}

</script>
<script>/* js/controller/sync.js */

async function sbAuth(mode){const url=($('#sbu').value||'').trim().replace(/\/+$/,'').replace(/\/(rest|auth)\/v1.*$/,''),key=($('#sbk').value||'').trim(),em=($('#sbe').value||'').trim(),pw=$('#sbp').value||'';
  if(!sbUrlOk(url))return sbMsg('La URL debe verse así: https://tuproyecto.supabase.co');
  if(key.length<20||/\s/.test(key))return sbMsg('Pega la clave pública (anon key) completa');
  if(!/^\S+@\S+\.\S+$/.test(em))return sbMsg('Escribe un correo válido');
  if(pw.length<6)return sbMsg('La contraseña debe tener al menos 6 caracteres');
  sbMsg('Conectando…');
  try{const r=await fetch(url+(mode==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const j=await r.json().catch(()=>({})),t=String(j.msg||j.error_description||j.message||j.error||'');
    if(!r.ok){return sbMsg(/invalid login/i.test(t)?'Correo o contraseña incorrectos. Si es tu primera vez, toca Crear cuenta.':/already registered/i.test(t)?'Ese correo ya tiene cuenta. Toca Entrar.':/not confirmed/i.test(t)?'Primero confirma tu correo: abre el mensaje que te enviaron.':/invalid api key|apikey/i.test(t)?'La clave pública no es correcta.':t||'No se pudo entrar')}
    if(!j.access_token)return sbMsg('Te enviamos un correo para confirmar la cuenta. Ábrelo y luego toca Entrar.');
    sb={url,key,at:j.access_token,rt:j.refresh_token,uid:j.user&&j.user.id,em};if(!sb.uid)return sbMsg('Respuesta inesperada de Supabase');
    sbStore();cloud=null;await sbInit(true);
    if(sbOn){closeM();toast('Sincronización activada')}else sbUi()}
  catch(e){sbMsg('No hay conexión con Supabase. Revisa la URL y tu internet.')}}
async function sbNow(){sbBusy=false;sbMsg('Sincronizando…');try{if(!cloud)await sbInit();const q=JSON.parse((await cloud.get()).data().json||'null');if(q)applyRemote(q);await cloud.set({json:snap()});draw();toast('Sincronizado');sbUi()}catch(e){sbUi()}}
function sbOut(){ask('¿Cerrar sesión? Tus datos se quedan en este dispositivo, pero dejarán de sincronizarse.','Cerrar sesión',()=>{try{if(sb&&sb.at)fetch(sb.url+'/auth/v1/logout',{method:'POST',headers:{apikey:sb.key,Authorization:'Bearer '+sb.at}}).catch(()=>{})}catch(e){}
  clearInterval(sbT);sb=null;sbOn=false;cloud=null;sbStore();sbErr='';draw();toast('Sesión cerrada')})}
function sbCopy(){const done=()=>sbMsg('SQL copiado. Pégalo en Supabase > SQL Editor y toca Run.');try{navigator.clipboard.writeText(SBSQL).then(done,()=>sbMsg('No se pudo copiar. Mantén presionado el texto y cópialo.'))}catch(e){sbMsg('No se pudo copiar.')}}

</script>

  const direct=()=>{try{new Notification(t,opt)}catch(e){}};
